[project]
name = "hybrid-modeling"
version = "0.1.0"
description = "System identification library: classical, ML, neural ODE/SDE/CDE and physics-informed hybrid models."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "scipy>=1.16.1",
    "scikit-learn>=1.8.0",
    "statsmodels>=0.14.6",
    "torch>=2.10.0",
    "torchdiffeq>=0.2.4",
    "torchcde>=0.2.5",
    "torchsde>=0.2.6",
    "torchvision>=0.22.0",
    "tqdm>=4.67.2",
    "wandb>=0.24.2",
    "opencv-python>=4.13.0.92",
    "imageio>=2.37.3",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.8.0",
    "imageio>=2.34.0",
]
